# Param defaults merged at --import time into .haro-docx-writer/templates/<id>/template.yaml
# (và ~/.haro-docx-writer/templates/<id>/template.yaml cho scope global).
# Sửa giá trị thật trong template.yaml của từng mẫu, không sửa file này.
#
# Đơn vị: số trần giữ nghĩa cũ (cỡ chữ/spacing = pt, margin/indent = cm,
# line_spacing là hệ số vô đơn vị). Chuỗi kèm đơn vị được convert tự động:
# "12pt", "2.54cm", "25mm", "1in" (vd margin_top_cm: "25mm" = 2.5cm).
company_name: "CÔNG TY TNHH MẪU VIỆT NAM"
solution_name: "Giải pháp Quản lý Dự án HARO"
document_name: "Tài liệu Đặc tả Yêu cầu Kỹ thuật (SAD)"
document_title: "TÀI LIỆU ĐẶC TẢ KỸ THUẬT PHẦN MỀM"
version: "1.0"
date: "23/09/2026"
status: "Ban hành"
authors:
  - "Nguyễn Văn A — Biên soạn"
reviewers:
  - "Trần Thị B — Kiểm tra"
approvers:
  - "Lê Văn C — Phê duyệt"
header:
  # Đường dẫn logo (png/jpg), tương đối từ thư mục mẫu. Để trống "" = không logo.
  # Khi --import bóc được ảnh từ file mẫu, ảnh nằm ở assets/ trong thư mục mẫu.
  logo_path: ""
styles:
  # Chuẩn mặc định: Times New Roman + đen duy nhất (000000).
  # H1 14pt / H2 13pt / H3 12pt / H4 12pt / H5 11pt / H6 11pt (đậm) / body 12pt / code Consolas 11pt.
  body_font: "Times New Roman"
  heading_color: "000000"
  code_font: "Consolas"
  body_size: "12pt"
  h1_size: "14pt"
  h2_size: "13pt"
  h3_size: "12pt"
  h4_size: "12pt"
  h5_size: "11pt"
  h6_size: "11pt"
  # Giãn dòng (hệ số, 1.0 = đơn) và cách đoạn body.
  body_line_spacing: 1.15
  body_space_before: "0pt"
  body_space_after: "6pt"
  # Cách đoạn chung cho H1–H6.
  heading_space_before: "12pt"
  heading_space_after: "6pt"
  # Bullet/danh sách: thụt đầu dòng và cách đoạn sau.
  bullet_indent_cm: "0.75cm"
  bullet_space_after: "2pt"
  code_size: "11pt"
page:
  # Khổ giấy: A4 | Letter. Hướng: portrait | landscape.
  size: A4
  orientation: portrait
  margin_top_cm: "2.54cm"
  margin_bottom_cm: "2.54cm"
  margin_left_cm: "2cm"
  margin_right_cm: "2cm"
  header_distance_cm: "1.27cm"
  footer_distance_cm: "1.27cm"
cover:
  # Cỡ chữ các dòng trang bìa.
  title_size: "24pt"
  solution_size: "14pt"
  company_size: "12pt"
  note_size: "9pt"
header_footer:
  # Cỡ chữ header/footer trang nội dung.
  doc_name_size: "9pt"
  company_size: "8pt"
  page_size: "8pt"
  solution_size: "8pt"
# Mức heading đưa vào Mục lục Word (vd "1-3", "1-6").
toc_levels: "1-6"
# Placeholder đã xác nhận ({{tên}} / [[tên]] trong file mẫu).
# Chỉ entry user duyệt mới ghi vào template.yaml — không tự sinh.
# Quy tắc fill lúc export: placeholders.<tên>.value (khác rỗng) >
# key YAML cùng tên ở top-level > --param name=value (cao nhất, không lưu).
# placeholders:
#   ten_du_an:
#     description: "Tên dự án triển khai"
#     value: ""
