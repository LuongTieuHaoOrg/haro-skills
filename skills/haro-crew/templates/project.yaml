# .haro-crew/config/project.yaml

# Project profile — created by /haro-crew (index).
# Every command reads this file first. Single source for idea + phase + language.

version: 1
updated_at: ""                # YYYY-MM-DD

name: ""                      # Product/project name
idea: ""                      # Original one-sentence idea from the user
goal: ""                      # Confirmed primary goal

project_type: ""              # outsource | freelance | personal (empty = ask in index)

phase: "index"                # index | plan | docs | build | done

stack: ""                     # Chosen stack (default: Next.js + PostgreSQL unless user changes)

language:
  response: "vi"              # Chat language with the user: "en" | "vi"
  documentation: "en"         # Docs + code language: "en" | "vi" | "vi-en"
