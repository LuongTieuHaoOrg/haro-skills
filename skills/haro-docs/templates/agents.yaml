# skills/haro-docs/templates/agents.yaml
# Reviewer preset registry — ALSO the template manifest (each entry points at its template file).
# /haro-docs init (onboarding) and /haro-docs config agents read this file to list presets.
# invoke: how this reviewer runs — inline (skill runs the prompt) | task (runtime Task subagent_type) | command (slash-command, runtime-dependent).
# For task entries, persona comes from the project copy (.haro-docs/agents/<id>.md); prompt below is only the review overlay.
# For inline entries, prompt below IS the persona (project copy holds the full body for tuning).

version: 1
updated_at: ""                # YYYY-MM-DD

# Pre-selected reviewer when the user does not pick explicitly.
default_reviewer: agent_reviewer

agents:
  - id: agent_lead
    enabled: true
    invoke: task
    type: agent_lead
    template: agents/agent_lead.md
    role: "Documentation Lead & Orchestrator — project init, doc structure, workflow coordination"
    prompt: >-
      Review the given docs as Documentation Lead: check overall structure,
      completeness, workflow alignment, and state tracking.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_ba
    enabled: true
    invoke: task
    type: agent_ba
    template: agents/agent_ba.md
    role: "Business Analyst & Product Owner — business requirements, user stories, acceptance criteria"
    prompt: >-
      Review docs as Business Analyst: trace requirements to business goals,
      check user stories, scope boundaries, and acceptance criteria.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_arch
    enabled: true
    invoke: task
    type: agent_arch
    template: agents/agent_arch.md
    role: "System & Data Architect — architecture design, components, data models"
    prompt: >-
      Review docs as System Architect: evaluate architecture design, data models,
      component integration, and technical constraints.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_uiux
    enabled: true
    invoke: task
    type: agent_uiux
    template: agents/agent_uiux.md
    role: "UI/UX Designer — user journeys, interface specifications, accessibility"
    prompt: >-
      Review docs as UI/UX Specialist: evaluate user flows, interaction design,
      screen states, and accessibility standards.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_devops
    enabled: true
    invoke: task
    type: agent_devops
    template: agents/agent_devops.md
    role: "DevOps & Infrastructure Specialist — deployment, CI/CD, operational runbooks"
    prompt: >-
      Review docs as DevOps Specialist: verify infrastructure topology, deployment pipelines,
      containerization, and operational runbooks.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_qa
    enabled: true
    invoke: task
    type: agent_qa
    template: agents/agent_qa.md
    role: "QA & Test Strategist — testability, test planning, verification methods"
    prompt: >-
      Review docs as QA Strategist: ensure all requirements have testable acceptance criteria
      and robust test strategies.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""

  - id: agent_reviewer
    enabled: true
    invoke: task
    type: agent_reviewer
    template: agents/agent_reviewer.md
    role: "Critical Reviewer — final quality gate, logic, assumptions, consistency"
    prompt: >-
      Review docs as Critical Reviewer: find hidden assumptions, missing evidence,
      logical flaws, and check consistency across atomic blocks.
      Return FINDINGS (claim → evidence) / COUNTER-ARGUMENTS /
      VERDICT (agree | conditionally-agree | disagree) /
      CONFIDENCE / OPEN QUESTIONS.
    model: ""
