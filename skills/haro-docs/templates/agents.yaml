  - id: lead
    enabled: false
    invoke: command
    command: "@agent_lead"
    template: agents/agent_lead.md
    role: "Lead coordinator — synthesizes multi-reviewer reports"
    prompt: >-
      Coordinate the attached reviewer reports for the given topic: resolve
